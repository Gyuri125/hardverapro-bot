# ============================================================
#  apro-deal-radar – konfiguráció
# ============================================================
#  Minden kulcsszó ékezet- és kis/nagybetű-függetlenül illeszkedik
#  ("hibas" = "hibás" = "HIBÁS").
#
#  Beállítva: max 450 eFt, RTX 4070 / 5060 / 5070 a sweet spot,
#  OLED előny, MAGYAR billentyűzet, bármilyen márka, személyes átvétel.
# ============================================================

settings:
  # Kérésenkénti szünet másodpercben. A hardverapro.hu robots.txt
  # crawl-delay: 1, ezért 1.5 alá ne menj.
  request_delay: 1.5
  timeout: 20
  retries: 3

  # Discord webhookot KIZÁRÓLAG környezeti változóból olvasunk,
  # hogy ne kerülhessen a repóba. GitHubon: Settings -> Secrets.
  webhook_env: DISCORD_WEBHOOK_URL

  # Ennél alacsonyabb pontszámú találatot nem küldünk el.
  # Túl kevés jön -> 40. Túl sok szemét -> 60.
  min_score: 50
  # Egy futásban max. ennyi értesítést küldünk (spam védelem).
  max_notifications: 15

  # Ezeket a hirdetéseket már láttuk -> ne küldjük újra.
  state_file: state/seen.json
  state_retention_days: 60
  # Ha egy korábban már elküldött hirdetés ára ennyivel lecsökken,
  # akkor újra szólunk róla. 0 = kikapcsolva.
  renotify_price_drop_percent: 10

  # Egyedi hirdetésoldalak letöltése a jelöltekhez (leírás + állapot
  # + billentyűzet + garancia). Ez adja a legpontosabb szűrést.
  deep_scan: true
  deep_scan_limit: 40

# ------------------------------------------------------------
#  HOL keressünk
# ------------------------------------------------------------
watches:
  - name: "Notebook – minden"
    url: "https://hardverapro.hu/aprok/notebook/index.html"
    max_pages: 3
    filters:
      min_price: 80000
      # A profilok úgyis 450 eFt-nál vágnak, ez csak biztonsági sáv.
      max_price: 500000

      # Ha ezek bármelyike szerepel a címben/leírásban -> kihagyjuk.
      # FIGYELEM: a "csere" és a "keresem" szándékosan NINCS itt, mert
      # szinte minden hirdetésben szerepel ("Csere: nem érdekel").
      exclude_keywords:
        - alkatrész
        - alkatrésznek
        - hibás
        - törött
        - nem működik
        - nem megy
        - kijelző hiba
        - javított
        - vízkár
        - lopott

      # MAGYAR BILLENTYŰZET: a kifejezetten külföldi (német/US/UK)
      # billentyűzetű gépeket kiszűri. Ha a hirdetés nem írja,
      # átengedjük – a Discord üzenetben látod, hogy "nem derül ki".
      keyboard: hu

      # Fizetett "Előresorolva" hirdetések kihagyása (általában boltok)
      exclude_promoted: true
      # Bolti (Bazár / üzleti) eladók engedélyezése
      allow_business: true
      # Csak ennyi pozitív értékelés felett (null = bármennyi)
      min_seller_rating: 0
      # Személyes átvétel bárhol az országban -> nincs helyszűrés.
      # Ha mégis kellene: locations: [budapest, debrecen]
      locations: []

# ------------------------------------------------------------
#  MI számít jó dealnek
#
#  A hirdetés akkor kerül be, ha VALAMELYIK profilra illeszkedik:
#    - minden `all_keywords` szerepel benne
#    - legalább egy `any_keywords` szerepel benne (ha van ilyen)
#    - egyik `none_keywords` sem szerepel benne
#    - az ár a [min_price, max_price] sávban van
#    - a `specs` megkötések teljesülnek (amit fel tudunk ismerni)
#
#  Pontszám (0-100):
#    35  profil illeszkedés
#    40  ár-előny a `deal_price`-hoz képest (vagy a piaci mediánhoz)
#    25  felszereltség: RAM, SSD, GPU, Hz, OLED, gari, magyar bill.
# ------------------------------------------------------------
profiles:
  # 1) A sweet spot: 4070 / 5050 / 5060 / 5070 alatt 450 eFt
  - name: "Sweet spot – RTX 4070 / 5050 / 5060 / 5070, 450 alatt"
    any_keywords: []
    all_keywords: []
    none_keywords: ["alkatrész", "hibás", "törött", "nem működik"]
    min_price: 150000
    max_price: 450000
    deal_price: 390000
    specs:
      gpu_any: ["4070", "5050", "5060", "5070", "4080", "5080"]
      min_ram_gb: 16
      min_storage_gb: 512

  # 2) Közép-kategória jó áron
  - name: "Közép gamer – RTX 4060 / 3070 / 5050, 360 alatt"
    any_keywords: []
    all_keywords: []
    none_keywords: ["alkatrész", "hibás", "törött", "nem működik"]
    min_price: 120000
    max_price: 360000
    deal_price: 300000
    specs:
      gpu_any: ["4060", "3060", "3070", "5050"]
      min_ram_gb: 16
      min_storage_gb: 512

  # 3) OLED – bármilyen gép, akár nem gamer
  - name: "OLED bármilyen gép – 450 alatt"
    any_keywords: []
    all_keywords: ["oled"]
    none_keywords: ["alkatrész", "hibás", "törött", "nem működik"]
    min_price: 120000
    max_price: 450000
    deal_price: 380000
    specs:
      min_ram_gb: 16

  # 4) Érték-alapú: nagy RAM + nagy SSD olcsón (üzleti / nem gamer is)
  #    A `strict: true` miatt csak akkor küldi, ha a 32 GB RAM és az
  #    1 TB SSD tényleg felismerhető a hirdetésből.
  - name: "Üzleti érték – 32 GB RAM + 1 TB SSD, 320 alatt"
    any_keywords: []
    all_keywords: []
    none_keywords: ["alkatrész", "hibás", "törött", "nem működik"]
    min_price: 100000
    max_price: 320000
    deal_price: 260000
    specs:
      min_ram_gb: 32
      min_storage_gb: 1024
      strict: true

# ------------------------------------------------------------
#  Piaci medián összehasonlítás
#  A futás során látott hirdetésekből számol egy medián árat
#  GPU-osztályonként, és ha egy hirdetés ennél jóval olcsóbb,
#  plusz pontot ad. Így nem kell minden árat kézzel belőni.
# ------------------------------------------------------------
market_compare:
  enabled: true
  group_by: gpu            # gpu | cpu | brand
  min_samples: 10          # ennyi hirdetés alatt nem számol mediánt
  good_deal_discount: 0.20 # 20% medián alatt = jó deal
