name: Hardverapró deal radar

# Naponta 3x fut (UTC-ben megadva!). Budapest = UTC+1 (tél) / UTC+2 (nyár),
# tehát ez kb. 06:10, 12:10 és 18:10 helyi idő.
on:
  schedule:
    - cron: "10 5,11,17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Csak listázás, Discord üzenet nélkül"
        type: boolean
        default: false
      max_pages:
        description: "Letöltött oldalak száma figyelőnként (üres = config.yaml)"
        required: false
        default: ""
      test_webhook:
        description: "Csak egy tesztüzenet a Discord webhookra"
        type: boolean
        default: false

# A state/seen.json visszakommitolásához kell.
permissions:
  contents: write

# Ne fussanak egymásra a párhuzamos futások.
concurrency:
  group: deal-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repo letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tesztek
        run: python -m pytest -q

      - name: Radar futtatása
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.test_webhook }}" = "true" ]; then ARGS="$ARGS --test-webhook"; fi
          if [ -n "${{ inputs.max_pages }}" ]; then ARGS="$ARGS --max-pages ${{ inputs.max_pages }}"; fi
          echo "Futtatás ezekkel a kapcsolókkal: $ARGS"
          python -m dealradar --config config.yaml $ARGS

      - name: Állapot (látott hirdetések) visszakommitolása
        if: always()
        run: |
          mkdir -p state
          if [ -n "$(git status --porcelain -- state)" ]; then
            git config user.name "deal-radar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/seen.json
            git commit -m "chore: state frissítés [skip ci]"
            git push
          else
            echo "Nincs változás a state-ben."
          fi
